name: daily pattern

# Renders the day's prnt.design pattern into pattern.svg and refreshes both
# READMEs. The pattern itself comes from prnt.design's public render route, so
# this job needs no credentials and nothing to build. See scripts/render-daily.mjs.

on:
  schedule:
    # 08:05 UTC: just past midnight Pacific in either DST offset.
    - cron: "5 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pattern
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Render today's pattern
        run: node scripts/render-daily.mjs

      - name: Commit if the pattern changed
        run: |
          if git diff --quiet -- pattern.svg README.md profile/README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pattern.svg README.md profile/README.md
          git commit -m "pattern: $(date -u +%Y-%m-%d)"
          git push
