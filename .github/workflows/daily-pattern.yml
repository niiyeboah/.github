name: daily pattern

# Renders the day's prnt.design pattern into pattern.svg and refreshes both
# READMEs. The pattern itself comes from prnt.design's public render route, so
# this job needs no credentials and nothing to build. See scripts/render-daily.mjs.

on:
  schedule:
    # 08:05 UTC: just past midnight Pacific in either DST offset.
    - cron: "5 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pattern
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # @napi-rs/canvas only, to composite the date bar onto the pattern.
      - name: Install
        run: npm ci

      - name: Render today's pattern
        run: node scripts/render-daily.mjs

      - name: Commit if the pattern changed
        run: |
          # Stage first, then diff the index. `git diff` against a path that no
          # longer exists reports no change and exits 0, which is how a rename
          # from pattern.svg to pattern.png already turned this step into a
          # silent no-op for a run. A bad pathspec fails `git add` loudly.
          git add pattern.png README.md profile/README.md
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "pattern: $(date -u +%Y-%m-%d)"
          git push
